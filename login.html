<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Vixel</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="beranda">
      <nav class="navbar">
        <div class="logo">Vixel</div>
        <ul class="menu-list">
          <li><a href="index.html">Dashboard</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="login.html" class="active">Profile</a></li>
        </ul>
      </nav>

      <section class="koleksi-section login-section">
        <div class="card login-card">
          <div class="login-header">
            <h2>Masuk ke Vixel</h2>
            <p>Temukan game sesuai *mood* kamu dengan akunmu</p>
          </div>

          <form>
            <div class="form-group">
              <label for="email">Email / Username</label>
              <input type="email" id="email" placeholder="nama@email.com" required />
            </div>

            <div class="form-group">
              <label for="password">Kata Sandi</label>
              <input type="password" id="password" placeholder="••••••••" required />
            </div>

            <div class="form-options">
              <div>
                <input type="checkbox" id="rememberMe" />
                <label for="rememberMe">Ingat Saya</label>
              </div>
              <a href="#">Lupa sandi?</a>
            </div>

            <button type="submit" class="btn-submit"><a href="index.html">Masuk</a></button>

            <div class="login-footer">
              Belum punya akun? <a href="#">Daftar sekarang</a>
            </div>
          </form>
        </div>
      </section>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
